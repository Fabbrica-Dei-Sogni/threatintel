# ============================================================
# Secure proxy :5543 — alessandromodica.it
# ============================================================
server {
    listen 5543 ssl;
    listen [::]:5543 ssl;

    server_name alessandromodica.it www.alessandromodica.it;

    ssl_certificate     /etc/letsencrypt/live/alessandromodica.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alessandromodica.it/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5540/;

        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;
        proxy_set_header X-Forwarded-Port     $server_port;
    }
}

