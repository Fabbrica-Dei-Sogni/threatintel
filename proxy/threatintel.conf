# ThreatIntel / Honeypot multiplexer.
#
# - HTTP traps: catch-all senza TLS.
# - TLS traps: server SNI separati per .it e .com.
# - Secure proxy :5543: server SNI separati per .it e .com.
#
# I due domini hanno certificati indipendenti gestiti da Certbot.

# ============================================================
# HTTP traps — catch-all / default virtual host
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    listen 8080 default_server;
    listen [::]:8080 default_server;

    listen 8000 default_server;
    listen [::]:8000 default_server;

    listen 5000 default_server;
    listen [::]:5000 default_server;

    listen 4200 default_server;
    listen [::]:4200 default_server;

    listen 7000 default_server;
    listen [::]:7000 default_server;

    # "_" è solo un placeholder convenzionale; default_server cattura
    # gli hostname non assegnati a virtual host specifici.
    server_name _;

    access_log /var/log/nginx/threatintel_access.log json_threatintel;
    error_log  /var/log/nginx/threatintel_error.log warn;

    limit_req_status 429;

    # Rifiuto diretto di scanner espliciti.
    if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|netsparker)") {
        return 444;
    }

    # Protezione di file dotfile, esclusa eventualmente .well-known.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Endpoint login: limite aggiuntivo.
    location = /login {
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3999;
        proxy_set_header Host                 $host;
        proxy_set_header X-Server-Port        $server_port;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;
    }

    # API di osservabilità: soltanto loopback.
    location ^~ /api/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3999;
        proxy_set_header Host                 $host;
        proxy_set_header X-Server-Port        $server_port;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;
    }

    # Honeypot HTTP e supporto WebSocket per eventuali canali realtime.
    location / {
        proxy_pass http://127.0.0.1:3999;

        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        proxy_set_header Host                 $host;
        proxy_set_header X-Server-Port        $server_port;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ============================================================
# TLS honeypot traps — alessandromodica.it
# ============================================================
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    listen 9443 ssl;
    listen [::]:9443 ssl;

    listen 10443 ssl;
    listen [::]:10443 ssl;

    server_name alessandromodica.it www.alessandromodica.it;

    ssl_certificate     /etc/letsencrypt/live/alessandromodica.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alessandromodica.it/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/threatintel_access.log json_threatintel;
    error_log  /var/log/nginx/threatintel_error.log warn;

    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:3999;

        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        proxy_set_header Host                 $host;
        proxy_set_header X-Server-Port        $server_port;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

